apiVersion: v1
kind: ConfigMap
metadata:
  name: whatsapp-api-config
  labels:
    app.kubernetes.io/name: whatsapp-api
    app.kubernetes.io/part-of: whatsapp-platform
data:
  # Non-secret runtime config. Secrets live in the Secret (see secret.example.yaml).
  PORT: "3000"
  NODE_ENV: "production"
  # Point these at your in-cluster Redis service.
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Drasken SSO
  SSO_API_URL: "https://sso.drasken.dev"
  SSO_ACCOUNTS_URL: "https://accounts.drasken.dev"
  # Meta OAuth redirect (must match the Meta App config)
  META_REDIRECT_URI: "https://api.example.com/connect/callback"
