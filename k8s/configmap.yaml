apiVersion: v1
kind: ConfigMap
metadata:
  name: whatsapp-api-config
  labels:
    app.kubernetes.io/name: whatsapp-api
    app.kubernetes.io/part-of: whatsapp-platform
data:
  # Non-secret runtime config. Secrets live in the Secret (see secret.example.yaml).
  PORT: "3000"
  NODE_ENV: "production"
  # API docs. Off here on purpose — this instance is public, and the docs
  # describe every endpoint and payload to anyone who finds the URL.
  SWAGGER_ENABLED: "false"
  # Redis connection string lives in the Secret (REDIS_URL) since it may carry
  # credentials. For a passwordless in-cluster Redis you may instead set it here:
  #   REDIS_URL: "redis://redis:6379"
  # DraskenLabs SSO — base URL for the confidential code→token exchange
  # (POST {SSO_API_URL}/auth/token). The client secret is NOT here; it lives in
  # the Secret. The browser-facing authorize redirect is handled by the web app.
  SSO_API_URL: "https://iam.draskenapis.com"
  # Redirect URI registered for this SSO client. Must EXACTLY match the web app's
  # /auth/callback URL (its SSO_REDIRECT_URI) and the value sent at token exchange.
  SSO_REDIRECT_URI: "https://wa.draskenapis.com/auth/callback"
  # Meta OAuth redirect (must match the Meta App config)
  META_REDIRECT_URI: "https://api.example.com/connect/callback"
  # Amazon SES — non-secret settings. Credentials live in the Secret, or are
  # omitted entirely when the pod uses an IAM role (IRSA).
  AWS_REGION: "eu-west-1"
  # Must be a verified SES identity, with DKIM, SPF and DMARC published.
  SES_FROM_ADDRESS: "no-reply@draskenlabs.com"
  SES_FROM_NAME: "WhatsApp Console"
  SES_REPLY_TO: "support@draskenlabs.com"
  # Configuration set wired to an SNS topic that posts to /mail/events, so
  # bounces and complaints suppress the address.
  SES_CONFIGURATION_SET: "whatsapp-console"
  # Absolute console URL, used for links inside emails.
  APP_BASE_URL: "https://wa.draskenapis.com"
  # The support form delivers to one mailbox, tagged with the topic:
  # privacy → support+privacy@, security → support+security@, and so on. The
  # `support` topic is left untagged. One inbox to watch, still filterable on
  # the To: header.
  SUPPORT_EMAIL: "support@draskenlabs.com"
  # Set to "false" for a mail provider without +tag subaddressing — every topic
  # then goes to SUPPORT_EMAIL unchanged.
  SUPPORT_EMAIL_TAGGING: "true"
  # Per-topic overrides. Set one to send that topic somewhere else entirely
  # (a real security@ mailbox, say); unset, the tagged address above is used.
  # PRIVACY_EMAIL: "privacy@draskenlabs.com"
  # SECURITY_EMAIL: "security@draskenlabs.com"
  # ABUSE_EMAIL: "abuse@draskenlabs.com"
  # LEGAL_EMAIL: "legal@draskenlabs.com"
