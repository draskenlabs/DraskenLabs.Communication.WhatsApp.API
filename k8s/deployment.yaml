apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-api
  labels:
    app.kubernetes.io/name: whatsapp-api
    app.kubernetes.io/part-of: whatsapp-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: whatsapp-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whatsapp-api
        app.kubernetes.io/part-of: whatsapp-platform
    spec:
      # Pulling from GHCR (private packages) needs an image pull secret:
      #   kubectl -n whatsapp-platform create secret docker-registry ghcr-secret \
      #     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
      imagePullSecrets:
        - name: ghcr-secret
      # Apply pending Prisma migrations before the app starts serving.
      initContainers:
        - name: migrate
          image: ghcr.io/draskenlabs/draskenlabs.communication.whatsapp.api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: whatsapp-api-config
            - secretRef:
                name: whatsapp-api-secrets
      containers:
        - name: api
          image: ghcr.io/draskenlabs/draskenlabs.communication.whatsapp.api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: whatsapp-api-config
            - secretRef:
                name: whatsapp-api-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
