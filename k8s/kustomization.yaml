apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: whatsapp-platform

# secret.example.yaml is intentionally excluded — create the real
# `whatsapp-api-secrets` Secret out-of-band (see secret.example.yaml).
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/part-of: whatsapp-platform

images:
  - name: ghcr.io/draskenlabs/draskenlabs.communication.whatsapp.api
    newTag: latest
