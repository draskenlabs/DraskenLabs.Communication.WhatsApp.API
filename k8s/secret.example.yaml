#   cp secret.example.yaml secret.yaml && kubectl apply -f secret.yaml
# Or create imperatively:
#   kubectl -n whatsapp-platform create secret generic whatsapp-api-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=JWT_SECRET=... (etc.)
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-api-secrets
  namespace: whatsapp-platform
  labels:
    app.kubernetes.io/name: whatsapp-api
    app.kubernetes.io/part-of: whatsapp-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/whatsapp_api"
  # AES-256-GCM key for encrypting access tokens at rest (32-byte hex)
  ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_HEX"
  JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_STRING"
  SSO_CLIENT_ID: "REPLACE_ME"
  META_APP_ID: "REPLACE_ME"
  META_APP_SECRET: "REPLACE_ME"
  WEBHOOK_VERIFY_TOKEN: "REPLACE_ME"
