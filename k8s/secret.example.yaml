# Template only — DO NOT commit real values.
# Copy to secret.yaml, fill in, and apply separately (kept out of git):
#   cp secret.example.yaml secret.yaml && kubectl apply -f secret.yaml
# Or create imperatively:
#   kubectl -n whatsapp-platform create secret generic whatsapp-api-secrets \
#     --from-literal=DATABASE_URL=... --from-literal=JWT_SECRET=... (etc.)
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-api-secrets
  namespace: whatsapp-platform
  labels:
    app.kubernetes.io/name: whatsapp-api
    app.kubernetes.io/part-of: whatsapp-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/whatsapp_api"
  # Redis connection string — include credentials/TLS here if needed:
  #   redis://:password@redis:6379/0   or   rediss://user:password@host:6380
  REDIS_URL: "redis://redis:6379"
  # AES-256-GCM key for encrypting access tokens at rest.
  # Base64-encoded 32-byte key: openssl rand -base64 32
  ENCRYPTION_KEY: "REPLACE_WITH_BASE64_32_BYTE_KEY"
  JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_STRING"
  SSO_CLIENT_ID: "REPLACE_ME"
  # Confidential SSO client secret — shown once at client registration.
  SSO_CLIENT_SECRET: "REPLACE_ME"
  META_APP_ID: "REPLACE_ME"
  META_APP_SECRET: "REPLACE_ME"
  WEBHOOK_VERIFY_TOKEN: "REPLACE_ME"
  # Firebase Cloud Messaging service account, base64-encoded JSON (see
  # .env.example). One value, no mounted file. Omit to disable push entirely —
  # the API starts fine without it.
  #   base64 -w0 serviceAccountKey.json
  FIREBASE_SERVICE_ACCOUNT_BASE64: "REPLACE_WITH_BASE64_SERVICE_ACCOUNT_JSON"
  # Amazon SES credentials. PREFER an IAM role for the service account (IRSA)
  # and omit both keys — the AWS SDK finds the role by itself and there is no
  # long-lived secret to rotate. The policy needs only ses:SendEmail.
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  # Enables POST /mail/broadcast for operational notices (policy change,
  # sub-processor change, breach). Omit to keep the endpoint disabled.
  MAIL_ADMIN_TOKEN: "REPLACE_WITH_A_LONG_RANDOM_STRING"
  # Enables the operator endpoints under /agency/internal. Omit to keep them
  # disabled.
  AGENCY_ADMIN_TOKEN: "REPLACE_WITH_A_LONG_RANDOM_STRING"
